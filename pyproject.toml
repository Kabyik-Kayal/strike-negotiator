[project]
name = "strike-negotiator"
version = "0.1.0"
description = "Voice-first grievance synthesis backend for the Strike Negotiator hackathon project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.42,<1.0",
    "fastapi>=0.115,<1.0",
    "pydantic>=2.7,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]
local-whisper = [
    "openai-whisper>=20231117",
]

[project.scripts]
strike-server = "server.main:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

